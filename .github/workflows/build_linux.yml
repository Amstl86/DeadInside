name: Build Linux executable

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pyinstaller
      - name: Prepare dist dir
        run: mkdir -p dist
      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --name deadinside_core core/api.py
      - name: Package artifact
        run: |
          mkdir -p dist/linux
          mv dist/deadinside_core dist/linux/ || true
          tar -czf dist/deadinside_linux.tar.gz -C dist linux
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deadinside-linux
          path: dist/deadinside_linux.tar.gz
